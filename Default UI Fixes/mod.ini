Description=Small fixes: the crafting list, store management bag and character list only show a scrollbar when they need one, the monster info tooltips fit their text, two hotbars close together no longer clip each other, the inventory's Zulie and weight stay on one line, the EXP percentage sits centred on the HUD's EXP bar, message boxes have Confirm and Cancel side by side, the first crafting material shows its count like the others, player shops have the shop name centred in the title bar, with the item name on the left (wrapping when long) and its price on the right.\nAdd-on for the game's default UI and the Steampunk UI theme. Each window checks which of the two is installed and uses its look.
Changes=Crafting: the first material slot shows its count like the other slots (small, top left), and it no longer shows through the open Type list.
Priority=5
