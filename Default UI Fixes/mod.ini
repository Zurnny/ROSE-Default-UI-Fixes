[Mod]
Name=Default UI Fixes
Version=1.14
Author=Zurnny
Group=
Description=Small fixes: the crafting list, store management bag and character list only show a scrollbar when they need one, the monster info tooltips fit their text, two hotbars close together no longer clip each other, the inventory's Zulie and weight stay on one line, the EXP percentage sits centred on the HUD's EXP bar, and player shops have the shop name centred in the title bar, with the item name on the left (wrapping when long) and its price on the right.\nAdd-on for the game's default UI and the Steampunk UI theme. Each window checks which of the two is installed and uses its look.
Changes=Weapon Refresh: the HUD weapon slot now takes its durability from the inventory's weapon slot (the game only updates its own HUD copy at login), checked every 2 seconds and when you hover it.
Priority=5
