Description=Small fixes for the game's default UI: the crafting list, store management bag and character list only show a scrollbar when they need one, the monster info tooltips fit their text, two hotbars close together no longer clip each other, and player shops (a shop you visit and your own) have the shop name centred in the title bar, with the item name on the left (wrapping when long) and its price on the right, level with each other.\nThe Steampunk UI theme already has these fixes.
Changes=Inventory: the zuly and weight no longer wrap onto two lines.
Priority=5
