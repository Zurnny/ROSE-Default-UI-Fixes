Description=Small fixes for the game's default UI: the crafting list, store management bag and character list only show a scrollbar when they need one, the monster info tooltips fit their text, and player shops (a shop you visit and your own) have the shop name centred in the title bar, with the item name on the left (wrapping when long) and its price on the right, level with each other.\nThe Steampunk UI theme already has these fixes.
Changes=Player shops: shop name centred in the title bar; item name on the left (wraps when long) and price on the right, level with each other.
