Description=Small fixes: the crafting list, store management bag and character list only show a scrollbar when they need one, the monster info tooltips fit their text, two hotbars close together no longer clip each other, the inventory's Zulie and weight stay on one line, and player shops have the shop name centred in the title bar, with the item name on the left (wrapping when long) and its price on the right.\nAdd-on for the game's default UI and the Steampunk UI theme. Each window checks which of the two is installed and uses its look.
Changes=Works with the default UI and the Steampunk UI theme: each window checks which one is installed and uses its look (no launcher needed).
Priority=5
