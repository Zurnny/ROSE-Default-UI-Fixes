Description=Small fixes: the crafting list, store management bag and character list only show a scrollbar when they need one, the monster info tooltips fit their text, two hotbars close together no longer clip each other, the inventory's Zulie and weight stay on one line, the EXP percentage sits centred on the HUD's EXP bar, the buff and proc icons by the minimap sit a little further left, clear of its edge, and player shops have the shop name centred in the title bar, with the item name on the left (wrapping when long) and its price on the right.\nAdd-on for the game's default UI and the Steampunk UI theme. Each window checks which of the two is installed and uses its look.
Changes=Steampunk look: wider brass flanges on the HP, MP and EXP bars, and the HP/MP numbers keep clear of them.
Priority=5
